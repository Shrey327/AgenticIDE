name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libx11-dev libxkbfile-dev libfuse2
      - run: npm ci --no-audit --no-fund
      - run: npm run collector:install
      - run: npm run extensions:install
      - run: npm run build:core
      - run: npm test
      - run: npm run build
      - run: npm run package -w @aiide/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: aiide-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
