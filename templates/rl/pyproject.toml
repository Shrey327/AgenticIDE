[project]
name = "aiide-rl-example"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
advanced = ["stable-baselines3==2.7.1", "gymnasium==1.2.2", "torch==2.10.0", "numpy==2.3.5", "matplotlib==3.10.7", "pillow==12.0.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
